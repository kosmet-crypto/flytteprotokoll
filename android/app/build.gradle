plugins {
    id 'com.android.application'
}

// The web app lives at the repo root; copy it into the APK so it works offline.
def webRoot = rootProject.file('..')
tasks.register('copyWebApp', Copy) {
    from(webRoot) {
        include 'index.html', 'app.css', 'manifest.json', 'icons/**', 'vendor/**'
    }
    into 'src/main/assets/www'
}
preBuild.dependsOn copyWebApp

android {
    namespace 'app.flytteprotokoll'
    compileSdk 35

    defaultConfig {
        applicationId 'app.flytteprotokoll'
        minSdk 26
        targetSdk 34  // 35 forces edge-to-edge; the page does not pad for system bars in a WebView
        // CI passes VERSION_CODE (run number + 100) so each new APK installs over the previous one.
        // The +100 keeps it above the builds from the repository's earlier history.
        versionCode((System.getenv('VERSION_CODE') ?: '1') as int)
        versionName "2.0.${System.getenv('VERSION_CODE') ?: '0'}"
        // Where the app looks for newer APKs (GitHub Releases of this repo).
        // Bump android/shell-version.txt when this Android code changes in a way the web app
        // depends on (new bridge methods etc.). Only then do phones need to install a new APK;
        // everything else reaches them as a silent content update.
        buildConfigField 'int', 'SHELL_VERSION', rootProject.file('shell-version.txt').text.trim()
        buildConfigField 'String', 'UPDATE_REPO', "\"${System.getenv('GITHUB_REPOSITORY') ?: 'kosmet-crypto/flytteprotokoll'}\""
    }

    signingConfigs {
        // Fixed key committed to the repo so every build can update the installed app.
        // Fine for sideloading; use a private key (GitHub secret) before publishing to Google Play.
        release {
            storeFile file('flytteprotokoll.keystore')
            storePassword 'flytteprotokoll'
            keyAlias 'flytteprotokoll'
            keyPassword 'flytteprotokoll'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation 'androidx.core:core:1.13.1'
}
